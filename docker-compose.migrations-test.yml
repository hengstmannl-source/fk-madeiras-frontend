services:
  mysql-migrations-test:
    image: mysql:8.4
    container_name: fk-madeiras-migrations-test-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: fkmadeiras_migrations_test
      MYSQL_USER: fk_madeiras_test
      MYSQL_PASSWORD: migration_test_password
      MYSQL_ROOT_PASSWORD: migration_test_root_password
    ports:
      - "3308:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pmigration_test_root_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  migration-test:
    build:
      context: .
      dockerfile: docker/local/Dockerfile
    container_name: fk-madeiras-migrations-test-runner
    depends_on:
      mysql-migrations-test:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://fk_madeiras_test:migration_test_password@mysql-migrations-test:3306/fkmadeiras_migrations_test
    command: ["sh", "-c", "pnpm drizzle-kit migrate && node scripts/verify-migrations.mjs"]
